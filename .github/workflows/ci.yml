name: Validate Poker Draft
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Standard hosted Linux runners are free for public repositories.
    # Skip if visibility changes so this workflow cannot start a paid private run.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: make check
      - run: cargo build --release --workspace --examples
      - run: cargo build --release --workspace
      - run: python3 scripts/smoke.py
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Browser integration
        run: |
          POKERDRAFT_DB=/tmp/pokerdraft-browser.db ./target/release/pokerdraft-server &
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:3000/healthz && break || sleep .1; done
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' | head -1)" make browser
